<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-rh="true">Webliix | Web Design, SEO &amp; Custom Software Development Agency</title>
    <meta data-rh="true" name="description" content="Webliix is a full-service digital agency building high-performance business websites, Shopify stores, custom web apps, and Google SEO that turn traffic into revenue." />
    <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="WEBLIIX" />
    <meta name="geo.region" content="IN-BR" />
    <meta name="geo.placename" content="Bhagalpur, Bihar, India" />
    <link data-rh="true" rel="canonical" href="https://webliix.com/" />

    
    <!-- ✅ Favicon Package -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#07111F" />

    <!-- ✅ Open Graph Metadata -->
    <meta data-rh="true" property="og:title" content="Webliix | Web Design, SEO &amp; Custom Software Development Agency" />
    <meta data-rh="true" property="og:description" content="Webliix is a full-service digital agency building high-performance business websites, Shopify stores, custom web apps, and Google SEO that turn traffic into revenue." />
    <meta data-rh="true" property="og:image" content="https://webliix.com/og-image.jpg" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:image:type" content="image/jpeg" />
    <meta data-rh="true" property="og:url" content="https://webliix.com/" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Webliix" />

    <!-- ✅ Twitter Card Metadata -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Webliix | Web Design, SEO &amp; Custom Software Development Agency" />
    <meta data-rh="true" name="twitter:description" content="Webliix is a full-service digital agency building high-performance business websites, Shopify stores, custom web apps, and Google SEO that turn traffic into revenue." />
    <meta data-rh="true" name="twitter:image" content="https://webliix.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- ✅ Non-blocking default theme fonts (Inter & Outfit) with font-display: swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" />
    </noscript>

    <!-- Global Organization & WebSite Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://webliix.com/#organization",
          "name": "Webliix",
          "alternateName": ["Webliix Agency", "Webliix Digital Solutions"],
          "url": "https://webliix.com",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://webliix.com/#logo",
            "url": "https://webliix.com/favicon-96x96.png",
            "caption": "Webliix Logo"
          },
          "image": "https://webliix.com/og-image.jpg",
          "description": "Webliix is a full-service digital agency providing custom website development, Shopify e-commerce stores, Google Business Profile (GMB) optimization, SEO, and paid advertising for businesses worldwide.",
          "telephone": "+91-9310181569",
          "email": "support@webliix.com",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Bhagalpur",
            "addressRegion": "Bihar",
            "addressCountry": "IN"
          },
          "founder": [
            {
              "@type": "Person",
              "name": "Himanshu Sharma",
              "jobTitle": "Co-Founder & Managing Director",
              "sameAs": "https://www.linkedin.com/in/himanshu-sharma-36480a246/"
            },
            {
              "@type": "Person",
              "name": "Abdul Latif",
              "jobTitle": "Co-Founder & Business Executive",
              "sameAs": "https://www.linkedin.com/in/abdul-latif-3a9249213/"
            }
          ],
          "sameAs": [
            "https://www.linkedin.com/company/webliix",
            "https://www.instagram.com/webliix",
            "https://github.com/webliix",
            "https://www.facebook.com/webliix"
          ],
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "telephone": "+91-9310181569",
              "contactType": "customer service",
              "areaServed": ["IN", "US", "CA", "DE", "GB"],
              "availableLanguage": ["English", "Hindi"]
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://webliix.com/#website",
          "url": "https://webliix.com",
          "name": "Webliix",
          "description": "Professional Website Development, SEO & Digital Growth Solutions",
          "publisher": {
            "@id": "https://webliix.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://webliix.com/blog?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ✅ Hidden Netlify Forms — required for Netlify build-time detection in SPA/React apps.
         All form submissions are handled by React components via fetch() with POST urlencoded. -->

    <!-- 1. First Visit Enquiry Modal Form -->
    <form name="first-visit-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"   name="name"    />
      <input type="tel"    name="phone"   />
      <input type="text"   name="service" />
      <textarea            name="message"></textarea>
      <input type="hidden" name="bot-field" />
    </form>

    <!-- 2. Contact Page Inquiry Form -->
    <form name="contact-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"   name="name"    />
      <input type="tel"    name="mobile"  />
      <input type="email"  name="email"   />
      <input type="text"   name="service" />
      <textarea            name="message"></textarea>
      <input type="hidden" name="bot-field" />
    </form>

    <!-- 3. Newsletter Subscription Form (Footer) -->
    <form name="newsletter-subscribe" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"     name="name"     />
      <input type="email"    name="email"    />
      <input type="text"     name="interest" />
      <input type="checkbox" name="agree"    />
      <input type="hidden"   name="bot-field" />
    </form>

    <!-- 4. Client Feedback & Review Form -->
    <form name="client-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"     name="name"           />
      <input type="text"     name="company"        />
      <input type="email"    name="email"          />
      <input type="text"     name="service"        />
      <input type="text"     name="rating"         />
      <textarea              name="feedback"></textarea>
      <input type="checkbox" name="publishConsent" />
      <input type="hidden"   name="bot-field" />
    </form>

    <!-- 5. Marketing Referral Partner Application Form -->
    <form name="marketing-partner-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"     name="name"              />
      <input type="email"    name="email"             />
      <input type="tel"      name="phone"             />
      <input type="text"     name="location"          />
      <input type="text"     name="profession"        />
      <input type="text"     name="payoutMethod"      />
      <input type="text"     name="payoutDetails"     />
      <textarea              name="clientLead"></textarea>
      <input type="checkbox" name="agreementAccepted" />
      <input type="hidden"   name="bot-field" />
    </form>

    <!-- 6. Unified Careers & Partner Application Form -->
    <form name="careers-and-partner-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"     name="applicationType"   />
      <input type="text"     name="position"          />
      <input type="text"     name="name"              />
      <input type="email"    name="email"             />
      <input type="tel"      name="phone"             />
      <input type="text"     name="location"          />
      <input type="text"     name="experience"        />
      <input type="text"     name="portfolioUrl"      />
      <input type="text"     name="resumeLink"        />
      <textarea              name="message"></textarea>
      <input type="text"     name="payoutMethod"      />
      <input type="text"     name="payoutDetails"     />
      <textarea              name="clientLead"></textarea>
      <input type="checkbox" name="agreementAccepted" />
      <input type="hidden"   name="bot-field" />
    </form>

    <!-- 7. Webliix LaunchKit Lead & Proposal Request Form -->
    <form name="launchkit-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"     name="name"         />
      <input type="text"     name="businessName" />
      <input type="email"    name="email"        />
      <input type="tel"      name="phone"        />
      <input type="text"     name="country"      />
      <input type="url"      name="website"      />
      <input type="text"     name="needs"        />
      <input type="text"     name="package"      />
      <input type="text"     name="budget"       />
      <input type="text"     name="targetMarket" />
      <textarea              name="message"></textarea>
      <input type="hidden"   name="bot-field" />
    </form>
  </body>
</html>
