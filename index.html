<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webliix | &lt; Your Success is our Code /&gt;</title>
    <meta name="description" content="Webliix is a leading digital agency offering professional website development, Google Business Profile (GMB) setup & SEO, software solutions, and branding services across NCR India, USA, Canada & Germany." />

    
    <!-- ✅ Favicon Package -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#090d16" />

    <!-- ✅ Open Graph Metadata -->
    <meta property="og:title" content="Webliix | Website Design, GMB, SEO & Software Development" />
    <meta property="og:description" content="Get ranked, verified, and branded with Webliix - Expert in Website Development, SEO, GMB Setup, Software & Digital Branding. Serving globally." />
    <meta property="og:image" content="https://webliix.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:url" content="https://webliix.com" />
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Webliix | Website Design, GMB, SEO & Software Development" />
    <meta name="twitter:description" content="Webliix provides affordable web design, GMB profile creation, local SEO, and branding services for your business." />
    <meta name="twitter:image" content="https://webliix.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ✅ Hidden Netlify Forms — required for Netlify build-time detection in SPA/React apps.
         All form submissions are handled by React components via fetch() with POST urlencoded. -->

    <!-- 1. First Visit Enquiry Modal Form -->
    <form name="first-visit-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"   name="name"    />
      <input type="tel"    name="phone"   />
      <input type="text"   name="service" />
      <textarea            name="message"></textarea>
      <input type="hidden" name="bot-field" />
    </form>

    <!-- 2. Contact Page Inquiry Form -->
    <form name="contact-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"   name="name"    />
      <input type="tel"    name="mobile"  />
      <input type="email"  name="email"   />
      <input type="text"   name="service" />
      <textarea            name="message"></textarea>
      <input type="hidden" name="bot-field" />
    </form>

    <!-- 3. Newsletter Subscription Form (Footer) -->
    <form name="newsletter-subscribe" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"     name="name"     />
      <input type="email"    name="email"    />
      <input type="text"     name="interest" />
      <input type="checkbox" name="agree"    />
      <input type="hidden"   name="bot-field" />
    </form>

    <!-- 4. Client Feedback & Review Form -->
    <form name="client-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text"     name="name"           />
      <input type="text"     name="company"        />
      <input type="email"    name="email"          />
      <input type="text"     name="service"        />
      <input type="text"     name="rating"         />
      <textarea              name="feedback"></textarea>
      <input type="checkbox" name="publishConsent" />
      <input type="hidden"   name="bot-field" />
    </form>
  </body>
</html>
